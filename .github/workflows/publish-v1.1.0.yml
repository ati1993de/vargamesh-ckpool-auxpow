name: Publish v1.1.0 and retire v1.0.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.1.0.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore(release): publish v1.1.0 and retire v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Create the new release, then remove the retired release and tag
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const newTag = 'v1.1.0';
            const oldTag = 'v1.0.0';
            const target = '7de8870e3e633ad61d8cf62aa4a184e5d90e054f';
            const expectedOldTagObject = '7014262acab0f7f3f3e49a527fa805bd301a044d';
            const expectedOldReleaseId = 396908926;

            // Verify target and guard against unexpectedly changed historical references.
            const targetCommit = await github.rest.repos.getCommit({ owner, repo, ref: target });
            if (targetCommit.data.sha !== target)
              throw Error('Unexpected release commit SHA');

            const previous = await github.rest.repos.getReleaseByTag({ owner, repo, tag: oldTag });
            if (previous.data.id !== expectedOldReleaseId)
              throw Error('Old release ID changed; aborting without deleting anything');

            const oldRef = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + oldTag });
            if (oldRef.data.object.sha !== expectedOldTagObject)
              throw Error('Old tag changed; aborting without deleting anything');

            try {
              const current = await github.rest.repos.getReleaseByTag({ owner, repo, tag: newTag });
              throw Error('New release ' + newTag + ' already exists: ' + current.data.html_url);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/' + newTag });
              throw Error('New tag ' + newTag + ' already exists');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const body = [
              '## VargaMesh CKPool AuxPoW v1.1.0',
              '',
              'Fixed developer fees for merged mining, implemented in the pool and its companion AuxPoW bridge.',
              '',
              '### Mandatory developer fees (unmodified fork)',
              '- **Bitcoin parent: 1.00%** of the BTC coinbase value goes directly to `bc1qdw2puj3g4ypqyxql7dy3jw2f29u5q7fkvd584m`.',
              '- **VargaMesh child: 1.00%** of the VMESH coinbase value goes directly to `vm1qsfsgj70pdv86nguvexzvsflmcknz4lrsj87wx9` **when running the matching updated [AuxPoW bridge](https://github.com/ati1993de/vargamesh-auxpow-bridge)**.',
              '',
              'BTC and VMESH block rewards are independent: a fee is paid on each chain only when a block is found on that chain. Rates and addresses are fixed in source code, not configurable through JSON or Stratum. Both projects reject missing fee outputs in the supported mining paths.',
              '',
              '### Changes',
              '- Fixed 100-basis-point BTC coinbase developer output, calculated with integer arithmetic.',
              '- Disallowed configuration-based fee overrides; fail-closed when the BTC fee output cannot be validated.',
              '- Updated companion VMESH bridge constructs and independently verifies the child fee output.',
              '- Updated documentation, automated regression tests and CI checks.',
              '- Proxy/passthrough/remote modes are unsupported in this fee-protected fork.',
              '',
              '### Deployment notes',
              '- Deploy **both updated repositories**; upgrading CKPool alone does not enforce VMESH fee payments.',
              '- Back up current production versions, recompile, and verify both coinbase transactions on staging before production.',
              '- Open-source code remains modifiable; this is **not** a BTC or VMESH consensus-level fee.',
              '',
              'BTC implementation commit: [`7de8870`](https://github.com/ati1993de/vargamesh-ckpool-auxpow/commit/7de8870e3e633ad61d8cf62aa4a184e5d90e054f)',
              'Companion bridge commit: [`1d54f25`](https://github.com/ati1993de/vargamesh-auxpow-bridge/commit/1d54f25f7daace7febdcfb51b0fcc5cd47837ba3)',
              '',
              'License: GPLv3.'
            ].join('\n');

            const created = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: newTag,
              target_commitish: target,
              name: 'VargaMesh CKPool AuxPoW v1.1.0 — Fixed 1% Developer Fees',
              body,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
              make_latest: 'true'
            });
            core.info('Created release ' + created.data.html_url);

            // Do not retire old version unless new release is definitely public.
            const checkNew = await github.rest.repos.getReleaseByTag({ owner, repo, tag: newTag });
            const newRef = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + newTag });
            if (checkNew.data.draft || checkNew.data.id !== created.data.id ||
                newRef.data.object.sha !== target) {
              throw Error('New release or tag verification failed; old release kept');
            }
            await github.rest.repos.deleteRelease({
              owner, repo, release_id: previous.data.id
            });
            core.info('Deleted old release ' + oldTag);
            await github.rest.git.deleteRef({
              owner, repo, ref: 'tags/' + oldTag
            });
            core.info('Deleted old tag ' + oldTag);
            core.notice('Release v1.1.0 is now the only published release.');
